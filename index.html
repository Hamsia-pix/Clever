<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>Clever</title>
  
  <!-- Связка с манифестом и иконкой -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
        }
      }
    }
  </script>
  <!-- Иконки Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior-y: none; user-select: none; }
    input, textarea { user-select: text; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">

  <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col bg-white dark:bg-slate-900 shadow-2xl relative pb-20"></div>

  <script>
    // Регистрация Service Worker для PWA / APK
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    const STORAGE_KEY = 'life_organizer_v2_data';

    const defaultState = {
      theme: 'dark',
      activeTab: 'notes',
      activeFolderId: 'all',
      folders: [
        { id: 'thoughts', name: 'Мысли' },
        { id: 'important', name: 'Важное' },
        { id: 'shopping', name: 'Покупки' }
      ],
      notes: [
        {
          id: 'n1',
          title: 'Список покупок на неделю',
          content: 'Зайти в фермерский магазин после работы',
          folderId: 'shopping',
          isPinned: true,
          isDeleted: false,
          updatedAt: 'Сегодня, 14:20',
          checklist: [
            { id: 'c1', text: 'Молоко и творог', done: true },
            { id: 'c2', text: 'Кофе в зернах', done: false }
          ]
        },
        {
          id: 'n2',
          title: 'Идеи для подарка маме',
          content: 'Уютный плед или сертификат в СПА.',
          folderId: 'important',
          isPinned: false,
          isDeleted: false,
          updatedAt: 'Вчера, 19:05',
          checklist: []
        }
      ],
      budgetView: 'list',
      selectedAccountId: 'all',
      accounts: [
        { id: 'acc_main', name: 'Основной', initialBalance: 45000, icon: 'credit-card' },
        { id: 'acc_save', name: 'Копилка', initialBalance: 120000, icon: 'piggy-bank' },
        { id: 'acc_cash', name: 'Наличка', initialBalance: 5500, icon: 'banknote' }
      ],
      categories: [
        { id: 'cat_food', name: 'Продукты', type: 'expense', color: '#f97316', icon: 'shopping-bag' },
        { id: 'cat_cafe', name: 'Кафе и отдых', type: 'expense', color: '#ec4899', icon: 'coffee' },
        { id: 'cat_trans', name: 'Транспорт', type: 'expense', color: '#3b82f6', icon: 'car' },
        { id: 'cat_salary', name: 'Зарплата', type: 'income', color: '#10b981', icon: 'briefcase' }
      ],
      transactions: [
        { id: 't1', type: 'income', amount: 65000, accountId: 'acc_main', categoryId: 'cat_salary', date: '2026-10-25', comment: 'Зарплата' },
        { id: 't2', type: 'expense', amount: 3450, accountId: 'acc_main', categoryId: 'cat_food', date: '2026-10-27', comment: 'Продукты' }
      ],
      calendarMonth: new Date().getMonth(),
      calendarYear: new Date().getFullYear(),
      selectedDate: new Date().toISOString().slice(0, 10),
      events: [
        { id: 'e1', title: 'День рождения Ани', date: '2026-10-30', type: 'birthday', notifyTime: '09:00', notifyBefore: 'За 1 день' }
      ]
    };

    let state = loadState();
    let uiModal = null;
    let editingNoteId = null;

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return { ...defaultState, ...JSON.parse(saved) };
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      applyTheme();
    }

    function applyTheme() {
      const html = document.documentElement;
      if (state.theme === 'dark') {
        html.classList.add('dark');
      } else {
        html.classList.remove('dark');
      }
    }

    const ACCENTS = {
      notes: { name: 'Заметки', bg: 'bg-orange-500', bgHover: 'hover:bg-orange-600', text: 'text-orange-500', hex: '#f97316' },
      budget: { name: 'Бюджет', bg: 'bg-emerald-500', bgHover: 'hover:bg-emerald-600', text: 'text-emerald-500', hex: '#10b981' },
      calendar: { name: 'Календарь', bg: 'bg-sky-500', bgHover: 'hover:bg-sky-600', text: 'text-sky-500', hex: '#0ea5e9' }
    };

    function formatMoney(num) {
      return Number(num || 0).toLocaleString('ru-RU') + ' ₽';
    }

    function getAccountBalance(accId) {
      const acc = state.accounts.find(a => a.id === accId);
      if (!acc) return 0;
      let bal = Number(acc.initialBalance) || 0;
      state.transactions.forEach(t => {
        if (t.accountId === accId) {
          bal += t.type === 'income' ? Number(t.amount) : -Number(t.amount);
        }
      });
      return bal;
    }

    function getTotalBalance() {
      return state.accounts.reduce((sum, a) => sum + getAccountBalance(a.id), 0);
    }

    function render() {
      applyTheme();
      const app = document.getElementById('app');
      const accent = ACCENTS[state.activeTab];

      if (editingNoteId) {
        app.innerHTML = renderNoteEditor();
        lucide.createIcons();
        return;
      }

      let contentHtml = '';
      if (state.activeTab === 'notes') contentHtml = renderNotesTab(accent);
      if (state.activeTab === 'budget') contentHtml = renderBudgetTab(accent);
      if (state.activeTab === 'calendar') contentHtml = renderCalendarTab(accent);

      app.innerHTML = `
        <header class="sticky top-0 z-20 px-4 pt-4 pb-3 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <span class="w-3 h-3 rounded-full ${accent.bg}"></span>
            <h1 class="text-xl font-bold tracking-tight">${accent.name}</h1>
          </div>
          <div class="flex items-center gap-2">
            ${state.activeTab === 'notes' ? `
              <button onclick="openModal('folders')" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-800 flex items-center gap-1.5">
                <i data-lucide="folder-cog" class="w-4 h-4 ${accent.text}"></i> Папки
              </button>
            ` : ''}
            ${state.activeTab === 'budget' ? `
              <button onclick="openModal('categories')" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-800 flex items-center gap-1.5">
                <i data-lucide="tags" class="w-4 h-4 ${accent.text}"></i> Категории
              </button>
            ` : ''}
            <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
              <i data-lucide="${state.theme === 'dark' ? 'sun' : 'moon'}" class="w-5 h-5"></i>
            </button>
          </div>
        </header>

        <main class="flex-1 px-4 py-4 space-y-4">
          ${contentHtml}
        </main>

        <button onclick="handlePlusClick()" class="fixed bottom-20 right-5 z-30 w-14 h-14 rounded-2xl ${accent.bg} ${accent.bgHover} text-white shadow-lg flex items-center justify-center transition active:scale-90">
          <i data-lucide="plus" class="w-7 h-7"></i>
        </button>

        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 grid grid-cols-3 py-2 px-2">
          <button onclick="switchTab('notes')" class="flex flex-col items-center py-1 transition ${state.activeTab === 'notes' ? 'text-orange-500 font-semibold' : 'text-slate-400'}">
            <i data-lucide="notebook-pen" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[11px]">Заметки</span>
          </button>
          <button onclick="switchTab('budget')" class="flex flex-col items-center py-1 transition ${state.activeTab === 'budget' ? 'text-emerald-500 font-semibold' : 'text-slate-400'}">
            <i data-lucide="wallet" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[11px]">Бюджет</span>
          </button>
          <button onclick="switchTab('calendar')" class="flex flex-col items-center py-1 transition ${state.activeTab === 'calendar' ? 'text-sky-500 font-semibold' : 'text-slate-400'}">
            <i data-lucide="calendar-days" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[11px]">Календарь</span>
          </button>
        </nav>

        ${uiModal ? renderModal(accent) : ''}
      `;
      lucide.createIcons();
    }

    function renderNotesTab(accent) {
      const isTrash = state.activeFolderId === 'trash';
      const filteredNotes = state.notes.filter(n => {
        if (isTrash) return n.isDeleted;
        if (n.isDeleted) return false;
        if (state.activeFolderId === 'all') return true;
        return n.folderId === state.activeFolderId;
      }).sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));

      return `
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
          <button onclick="selectFolder('all')" class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap ${state.activeFolderId === 'all' ? `${accent.bg} text-white` : 'bg-slate-100 dark:bg-slate-800 text-slate-400'}">Все</button>
          ${state.folders.map(f => `
            <button onclick="selectFolder('${f.id}')" class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap ${state.activeFolderId === f.id ? `${accent.bg} text-white` : 'bg-slate-100 dark:bg-slate-800 text-slate-400'}">${f.name}</button>
          `).join('')}
          <button onclick="selectFolder('trash')" class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap flex items-center gap-1 ${isTrash ? 'bg-rose-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-400'}">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Корзина
          </button>
        </div>

        <div class="space-y-3">
          ${filteredNotes.length === 0 ? `<div class="text-center py-12 text-slate-400 text-sm">Заметок нет</div>` : filteredNotes.map(n => `
            <div onclick="${isTrash ? '' : `openNote('${n.id}')`}" class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-800 cursor-pointer">
              <div class="flex items-start justify-between mb-1">
                <h3 class="font-semibold text-base">${n.title || 'Без названия'}</h3>
                ${n.isPinned && !isTrash ? `<i data-lucide="pin" class="w-4 h-4 text-orange-500 fill-orange-500"></i>` : ''}
              </div>
              ${n.content ? `<p class="text-xs text-slate-400 line-clamp-2 mb-2">${n.content}</p>` : ''}
              ${n.checklist && n.checklist.length > 0 ? `
                <div class="space-y-1 my-2" onclick="event.stopPropagation()">
                  ${n.checklist.map(it => `
                    <label class="flex items-center gap-2 text-xs">
                      <input type="checkbox" ${it.done ? 'checked' : ''} onchange="toggleCheckItem('${n.id}', '${it.id}')" class="rounded accent-orange-500" />
                      <span class="${it.done ? 'line-through text-slate-500' : ''}">${it.text}</span>
                    </label>
                  `).join('')}
                </div>
              ` : ''}
              <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-200 dark:border-slate-700/50 text-[11px] text-slate-400">
                <span>${state.folders.find(f => f.id === n.folderId)?.name || 'Без папки'}</span>
                ${isTrash ? `
                  <div class="flex gap-2" onclick="event.stopPropagation()">
                    <button onclick="restoreNote('${n.id}')" class="text-emerald-500">Восстановить</button>
                    <button onclick="deleteNoteForever('${n.id}')" class="text-rose-500">Удалить</button>
                  </div>
                ` : `<span>${n.updatedAt}</span>`}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderNoteEditor() {
      const note = state.notes.find(n => n.id === editingNoteId);
      if (!note) return '';

      return `
        <div class="flex flex-col min-h-screen bg-white dark:bg-slate-900">
          <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between sticky top-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md z-10">
            <button onclick="closeNoteEditor()" class="text-sm font-medium text-orange-500 flex items-center gap-1">
              <i data-lucide="arrow-left" class="w-5 h-5"></i> Назад
            </button>
            <span class="text-[11px] text-emerald-500">Автосохранено ✓</span>
            <div class="flex items-center gap-2">
              <button onclick="togglePinNote('${note.id}')" class="p-2 rounded-xl ${note.isPinned ? 'text-orange-500' : 'text-slate-400'}"><i data-lucide="pin" class="w-4 h-4"></i></button>
              <button onclick="moveNoteToTrash('${note.id}')" class="p-2 rounded-xl text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </div>
          <div class="p-4 space-y-4 flex-1">
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
              ${state.folders.map(f => `
                <button onclick="updateNoteFolder('${note.id}', '${f.id}')" class="px-3 py-1 rounded-full text-xs ${note.folderId === f.id ? 'bg-orange-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-400'}">${f.name}</button>
              `).join('')}
            </div>
            <input type="text" placeholder="Заголовок..." value="${(note.title || '').replace(/"/g, '&quot;')}" oninput="autoSaveNote('${note.id}', 'title', this.value)" class="w-full text-xl font-bold bg-transparent focus:outline-none" />
            <textarea rows="6" placeholder="Текст заметки..." oninput="autoSaveNote('${note.id}', 'content', this.value)" class="w-full text-sm bg-transparent focus:outline-none resize-none leading-relaxed">${note.content || ''}</textarea>
            
            <div class="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-2">
              <div class="flex justify-between items-center">
                <span class="text-xs text-slate-400 font-semibold uppercase">Чек-лист</span>
                <button onclick="addChecklistItem('${note.id}')" class="text-xs text-orange-500 font-medium">+ Добавить пункт</button>
              </div>
              ${(note.checklist || []).map(it => `
                <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-800/60 p-2 rounded-xl">
                  <input type="checkbox" ${it.done ? 'checked' : ''} onchange="toggleCheckItem('${note.id}', '${it.id}')" class="rounded accent-orange-500" />
                  <input type="text" value="${(it.text || '').replace(/"/g, '&quot;')}" oninput="autoSaveCheckText('${note.id}', '${it.id}', this.value)" placeholder="Пункт..." class="flex-1 text-sm bg-transparent focus:outline-none" />
                  <button onclick="removeCheckItem('${note.id}', '${it.id}')" class="text-slate-400 hover:text-rose-500"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderBudgetTab(accent) {
      const filteredTx = state.transactions
        .filter(t => state.selectedAccountId === 'all' || t.accountId === state.selectedAccountId)
        .sort((a, b) => b.date.localeCompare(a.date));

      const totalIncome = filteredTx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
      const totalExpense = filteredTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);

      const header = `
        <div class="p-4 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white shadow-md">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs opacity-80">Общий баланс</span>
            <button onclick="openModal('accounts')" class="text-xs bg-white/20 px-2 py-1 rounded-lg">⚙ Счета</button>
          </div>
          <div class="text-2xl font-bold mb-3">${formatMoney(getTotalBalance())}</div>
          <div class="grid grid-cols-2 gap-2 pt-2 border-t border-white/20 text-xs">
            <div><span class="opacity-75 block">Доходы</span><span class="font-semibold text-sm">+${formatMoney(totalIncome)}</span></div>
            <div><span class="opacity-75 block">Расходы</span><span class="font-semibold text-sm">-${formatMoney(totalExpense)}</span></div>
          </div>
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
          <button onclick="selectAccountFilter('all')" class="px-3 py-2 rounded-xl text-xs border ${state.selectedAccountId === 'all' ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}">Все счета</button>
          ${state.accounts.map(a => `
            <button onclick="selectAccountFilter('${a.id}')" class="px-3 py-2 rounded-xl text-xs border flex items-center gap-2 ${state.selectedAccountId === a.id ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}">
              <i data-lucide="${a.icon || 'wallet'}" class="w-3.5 h-3.5"></i>
              <div class="text-left"><div>${a.name}</div><div class="text-[10px] opacity-75">${formatMoney(getAccountBalance(a.id))}</div></div>
            </button>
          `).join('')}
        </div>

        <div class="grid grid-cols-2 p-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-medium">
          <button onclick="setBudgetView('list')" class="py-1.5 rounded-lg ${state.budgetView === 'list' ? 'bg-emerald-500 text-white' : 'text-slate-400'}">Операции</button>
          <button onclick="setBudgetView('analytics')" class="py-1.5 rounded-lg ${state.budgetView === 'analytics' ? 'bg-emerald-500 text-white' : 'text-slate-400'}">Аналитика</button>
        </div>
      `;

      if (state.budgetView === 'analytics') {
        return header + renderBudgetAnalytics(filteredTx, totalIncome, totalExpense);
      }

      return header + `
        <div class="space-y-2.5">
          ${filteredTx.length === 0 ? `<p class="text-xs text-slate-400 text-center py-8">Операций нет</p>` : filteredTx.map(t => {
            const cat = state.categories.find(c => c.id === t.categoryId) || { name: 'Прочее', color: '#64748b', icon: 'tag' };
            const acc = state.accounts.find(a => a.id === t.accountId) || { name: 'Счет' };
            return `
              <div onclick="openEditTx('${t.id}')" class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-800 flex items-center justify-between cursor-pointer">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white" style="background-color: ${cat.color}"><i data-lucide="${cat.icon || 'tag'}" class="w-5 h-5"></i></div>
                  <div>
                    <div class="font-medium text-sm">${cat.name}</div>
                    <div class="text-[11px] text-slate-400">${acc.name} • ${t.date}</div>
                  </div>
                </div>
                <div class="text-right">
                  <div class="font-bold text-sm ${t.type === 'income' ? 'text-emerald-500' : 'text-slate-100'}">${t.type === 'income' ? '+' : '-'}${formatMoney(t.amount)}</div>
                  <span class="text-[10px] text-slate-400">Изменить</span>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderBudgetAnalytics(transactions, totalIncome, totalExpense) {
      const expenses = transactions.filter(t => t.type === 'expense');
      const byCat = {};
      expenses.forEach(t => byCat[t.categoryId] = (byCat[t.categoryId] || 0) + Number(t.amount));
      const entries = Object.entries(byCat).map(([cid, amt]) => ({
        cat: state.categories.find(c => c.id === cid) || { name: 'Прочее', color: '#64748b' },
        amt
      })).sort((a,b) => b.amt - a.amt);

      return `
        <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-800 space-y-3">
          <h4 class="text-xs font-semibold text-slate-400 uppercase">Расходы по категориям</h4>
          ${entries.map(e => `
            <div class="space-y-1">
              <div class="flex justify-between text-xs">
                <span>${e.cat.name}</span>
                <span class="font-medium">${formatMoney(e.amt)}</span>
              </div>
              <div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                <div class="h-full rounded-full" style="width: ${Math.round((e.amt / (totalExpense || 1)) * 100)}%; background-color: ${e.cat.color}"></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderCalendarTab(accent) {
      const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      const year = state.calendarYear;
      const month = state.calendarMonth;
      const firstDay = new Date(year, month, 1);
      const startOffset = (firstDay.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let cells = '';
      for (let i = 0; i < startOffset; i++) cells += `<div class="h-10"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const hasEvents = state.events.some(e => e.date.slice(5) === dateStr.slice(5));
        const isSelected = state.selectedDate === dateStr;
        cells += `
          <button onclick="selectCalendarDate('${dateStr}')" class="h-10 rounded-xl flex flex-col items-center justify-center text-xs font-medium ${isSelected ? 'bg-sky-500 text-white font-bold' : 'hover:bg-slate-800'}">
            <span>${d}</span>
            ${hasEvents ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-sky-500'} mt-0.5"></span>` : ''}
          </button>
        `;
      }

      return `
        <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-800">
          <div class="flex justify-between items-center mb-3">
            <button onclick="changeMonth(-1)" class="p-1.5 rounded-lg bg-slate-200 dark:bg-slate-700"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
            <div class="font-bold text-sm">${monthNames[month]} ${year}</div>
            <button onclick="changeMonth(1)" class="p-1.5 rounded-lg bg-slate-200 dark:bg-slate-700"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
          </div>
          <div class="grid grid-cols-7 text-center text-[11px] text-slate-400 mb-1">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
          </div>
          <div class="grid grid-cols-7 gap-1">${cells}</div>
        </div>

        <div class="space-y-2.5">
          <div class="flex justify-between items-center">
            <h4 class="text-xs font-semibold uppercase text-slate-400">События и дни рождения</h4>
            <button onclick="testNotification()" class="text-xs text-sky-500">🔔 Тест уведомления</button>
          </div>
          ${state.events.map(ev => `
            <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-800 flex justify-between items-center">
              <div>
                <div class="font-medium text-sm">${ev.title}</div>
                <div class="text-[11px] text-slate-400">📅 ${ev.date} • ⏰ ${ev.notifyBefore}, ${ev.notifyTime}</div>
              </div>
              <button onclick="deleteEvent('${ev.id}')" class="text-slate-400 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderModal(accent) {
      let body = '';
      if (uiModal.type === 'transaction') {
        const t = uiModal.data;
        const cats = state.categories.filter(c => c.type === t.type);
        body = `
          <h3 class="text-lg font-bold mb-3">${t.id ? 'Редактировать операцию' : 'Новая операция'}</h3>
          <div class="grid grid-cols-2 p-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-medium mb-3">
            <button onclick="switchTxType('expense')" class="py-2 rounded-lg ${t.type === 'expense' ? 'bg-rose-500 text-white' : 'text-slate-400'}">Расход</button>
            <button onclick="switchTxType('income')" class="py-2 rounded-lg ${t.type === 'income' ? 'bg-emerald-500 text-white' : 'text-slate-400'}">Доход</button>
          </div>
          <div class="space-y-3 text-sm">
            <div><label class="text-xs text-slate-400 block mb-1">Сумма (₽)</label><input id="tx-amount" type="number" value="${t.amount || ''}" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-lg font-bold" /></div>
            <div class="grid grid-cols-2 gap-2">
              <div><label class="text-xs text-slate-400 block mb-1">Счёт</label><select id="tx-account" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800">${state.accounts.map(a => `<option value="${a.id}" ${t.accountId === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}</select></div>
              <div><label class="text-xs text-slate-400 block mb-1">Дата</label><input id="tx-date" type="date" value="${t.date}" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800" /></div>
            </div>
            <div><label class="text-xs text-slate-400 block mb-1">Категория</label><select id="tx-category" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800">${cats.map(c => `<option value="${c.id}" ${t.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div>
            <div><label class="text-xs text-slate-400 block mb-1">Комментарий</label><input id="tx-comment" type="text" value="${t.comment || ''}" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800" /></div>
            <div class="flex gap-2 pt-2">
              ${t.id ? `<button onclick="deleteTx('${t.id}')" class="px-4 py-2.5 rounded-xl bg-rose-500/15 text-rose-500">Удалить</button>` : ''}
              <button onclick="saveTxModal()" class="flex-1 py-2.5 rounded-xl bg-emerald-500 text-white font-semibold">Сохранить</button>
            </div>
          </div>
        `;
      } else if (uiModal.type === 'folders') {
        body = `
          <h3 class="text-lg font-bold mb-3">Папки заметок</h3>
          <div class="space-y-2 mb-4">${state.folders.map(f => `<div class="flex justify-between items-center p-2 rounded-xl bg-slate-100 dark:bg-slate-800"><span>${f.name}</span><button onclick="deleteFolder('${f.id}')" class="text-rose-500 text-xs">Удалить</button></div>`).join('')}</div>
          <div class="flex gap-2"><input id="new-folder-name" type="text" placeholder="Новая папка..." class="flex-1 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm" /><button onclick="addFolder()" class="px-4 py-2 rounded-xl bg-orange-500 text-white text-sm font-semibold">+</button></div>
        `;
      } else if (uiModal.type === 'accounts') {
        body = `
          <h3 class="text-lg font-bold mb-3">Мои счета</h3>
          <div class="space-y-2.5 mb-4">${state.accounts.map(a => `
            <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 space-y-1">
              <div class="flex justify-between items-center"><input type="text" value="${a.name}" onchange="updateAccount('${a.id}','name',this.value)" class="font-semibold text-sm bg-transparent" />${state.accounts.length > 1 ? `<button onclick="deleteAccount('${a.id}')" class="text-xs text-rose-500">Удалить</button>` : ''}</div>
              <div class="flex justify-between text-xs text-slate-400"><span>Начальный баланс (₽):</span><input type="number" value="${a.initialBalance}" onchange="updateAccount('${a.id}','initialBalance',this.value)" class="w-24 px-1 rounded bg-slate-900 text-right" /></div>
            </div>
          `).join('')}</div>
          <div class="flex gap-2"><input id="new-acc-name" type="text" placeholder="Новый счёт..." class="flex-1 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm" /><button onclick="addAccount()" class="px-4 py-2 rounded-xl bg-emerald-500 text-white font-semibold">+</button></div>
        `;
      } else if (uiModal.type === 'categories') {
        const tabType = uiModal.catType || 'expense';
        const list = state.categories.filter(c => c.type === tabType);
        body = `
          <h3 class="text-lg font-bold mb-3">Категории</h3>
          <div class="grid grid-cols-2 p-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-medium mb-3">
            <button onclick="switchCatType('expense')" class="py-1.5 rounded-lg ${tabType === 'expense' ? 'bg-rose-500 text-white' : 'text-slate-400'}">Расходы</button>
            <button onclick="switchCatType('income')" class="py-1.5 rounded-lg ${tabType === 'income' ? 'bg-emerald-500 text-white' : 'text-slate-400'}">Доходы</button>
          </div>
          <div class="space-y-2 mb-4 max-h-56 overflow-y-auto">${list.map(c => `<div class="flex justify-between items-center p-2 rounded-xl bg-slate-100 dark:bg-slate-800"><div class="flex items-center gap-2"><input type="color" value="${c.color}" onchange="updateCat('${c.id}','color',this.value)" class="w-5 h-5 bg-transparent" /><input type="text" value="${c.name}" onchange="updateCat('${c.id}','name',this.value)" class="text-sm bg-transparent" /></div><button onclick="deleteCat('${c.id}')" class="text-xs text-rose-500">Удалить</button></div>`).join('')}</div>
          <div class="flex gap-2"><input id="new-cat-name" type="text" placeholder="Название..." class="flex-1 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm" /><button onclick="addCat('${tabType}')" class="px-4 py-2 rounded-xl bg-emerald-500 text-white font-semibold">+</button></div>
        `;
      } else if (uiModal.type === 'event') {
        body = `
          <h3 class="text-lg font-bold mb-3">Новое событие</h3>
          <div class="space-y-3 text-sm">
            <div><label class="text-xs text-slate-400 block mb-1">Название</label><input id="ev-title" type="text" placeholder="День рождения..." class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800" /></div>
            <div class="grid grid-cols-2 gap-2">
              <div><label class="text-xs text-slate-400 block mb-1">Дата</label><input id="ev-date" type="date" value="${state.selectedDate}" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800" /></div>
              <div><label class="text-xs text-slate-400 block mb-1">Когда напомнить</label><select id="ev-before" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800"><option>За 1 день</option><option>В день события</option><option>За 3 дня</option></select></div>
            </div>
            <div><label class="text-xs text-slate-400 block mb-1">Время</label><input id="ev-time" type="time" value="09:00" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800" /></div>
            <button onclick="saveEvent()" class="w-full py-2.5 rounded-xl bg-sky-500 text-white font-semibold mt-2">Сохранить</button>
          </div>
        `;
      }

      return `
        <div onclick="closeModal()" class="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div onclick="event.stopPropagation()" class="w-full max-w-md bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl p-5 border-t border-slate-800 shadow-2xl">
            <div class="flex justify-end mb-1"><button onclick="closeModal()" class="p-1 text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button></div>
            ${body}
          </div>
        </div>
      `;
    }

    function toggleTheme() { state.theme = state.theme === 'dark' ? 'light' : 'dark'; saveState(); render(); }
    function switchTab(t) { state.activeTab = t; editingNoteId = null; saveState(); render(); }
    function handlePlusClick() {
      if (state.activeTab === 'notes') {
        const n = { id: 'n_' + Date.now(), title: '', content: '', folderId: state.activeFolderId !== 'all' && state.activeFolderId !== 'trash' ? state.activeFolderId : (state.folders[0]?.id || 'thoughts'), isPinned: false, isDeleted: false, updatedAt: 'Только что', checklist: [] };
        state.notes.unshift(n);
        editingNoteId = n.id;
        saveState(); render();
      } else if (state.activeTab === 'budget') {
        uiModal = { type: 'transaction', data: { id: null, type: 'expense', amount: '', accountId: state.selectedAccountId !== 'all' ? state.selectedAccountId : state.accounts[0].id, categoryId: state.categories.find(c => c.type === 'expense')?.id || '', date: new Date().toISOString().slice(0, 10), comment: '' } };
        render();
      } else if (state.activeTab === 'calendar') {
        uiModal = { type: 'event' };
        render();
      }
    }

    function selectFolder(id) { state.activeFolderId = id; saveState(); render(); }
    function openNote(id) { editingNoteId = id; render(); }
    function closeNoteEditor() {
      const n = state.notes.find(x => x.id === editingNoteId);
      if (n && !n.title.trim() && !n.content.trim() && (!n.checklist || n.checklist.length === 0)) {
        state.notes = state.notes.filter(x => x.id !== editingNoteId);
      }
      editingNoteId = null; saveState(); render();
    }
    function autoSaveNote(id, f, val) { const n = state.notes.find(x => x.id === id); if (n) { n[f] = val; n.updatedAt = 'Только что'; saveState(); } }
    function updateNoteFolder(nid, fid) { const n = state.notes.find(x => x.id === nid); if (n) { n.folderId = fid; saveState(); render(); } }
    function togglePinNote(id) { const n = state.notes.find(x => x.id === id); if (n) { n.isPinned = !n.isPinned; saveState(); render(); } }
    function moveNoteToTrash(id) { const n = state.notes.find(x => x.id === id); if (n) { n.isDeleted = true; editingNoteId = null; saveState(); render(); } }
    function restoreNote(id) { const n = state.notes.find(x => x.id === id); if (n) { n.isDeleted = false; saveState(); render(); } }
    function deleteNoteForever(id) { state.notes = state.notes.filter(x => x.id !== id); saveState(); render(); }
    function addChecklistItem(id) { const n = state.notes.find(x => x.id === id); if (n) { n.checklist = n.checklist || []; n.checklist.push({ id: 'c_' + Date.now(), text: '', done: false }); saveState(); render(); } }
    function toggleCheckItem(nid, cid) { const n = state.notes.find(x => x.id === nid); const c = n?.checklist?.find(x => x.id === cid); if (c) { c.done = !c.done; saveState(); render(); } }
    function autoSaveCheckText(nid, cid, val) { const n = state.notes.find(x => x.id === nid); const c = n?.checklist?.find(x => x.id === cid); if (c) { c.text = val; saveState(); } }
    function removeCheckItem(nid, cid) { const n = state.notes.find(x => x.id === nid); if (n) { n.checklist = n.checklist.filter(x => x.id !== cid); saveState(); render(); } }
    function addFolder() { const val = document.getElementById('new-folder-name')?.value.trim(); if (val) { state.folders.push({ id: 'f_' + Date.now(), name: val }); saveState(); render(); } }
    function deleteFolder(id) { state.folders = state.folders.filter(f => f.id !== id); if (state.activeFolderId === id) state.activeFolderId = 'all'; saveState(); render(); }

    function selectAccountFilter(id) { state.selectedAccountId = id; saveState(); render(); }
    function setBudgetView(v) { state.budgetView = v; saveState(); render(); }
    function openEditTx(id) { const t = state.transactions.find(x => x.id === id); if (t) { uiModal = { type: 'transaction', data: { ...t } }; render(); } }
    function switchTxType(t) { if (uiModal) { uiModal.data.type = t; uiModal.data.categoryId = state.categories.find(c => c.type === t)?.id || ''; render(); } }
    function saveTxModal() {
      const amount = Number(document.getElementById('tx-amount').value);
      const accountId = document.getElementById('tx-account').value;
      const date = document.getElementById('tx-date').value;
      const categoryId = document.getElementById('tx-category').value;
      const comment = document.getElementById('tx-comment').value.trim();
      if (!amount || amount <= 0) return alert('Укажи сумму больше 0');
      const d = uiModal.data;
      if (d.id) {
        const idx = state.transactions.findIndex(t => t.id === d.id);
        if (idx !== -1) state.transactions[idx] = { ...d, amount, accountId, date, categoryId, comment };
      } else {
        state.transactions.unshift({ id: 't_' + Date.now(), type: d.type, amount, accountId, date, categoryId, comment });
      }
      uiModal = null; saveState(); render();
    }
    function deleteTx(id) { state.transactions = state.transactions.filter(t => t.id !== id); uiModal = null; saveState(); render(); }
    function updateAccount(id, f, val) { const a = state.accounts.find(x => x.id === id); if (a) { a[f] = f === 'initialBalance' ? Number(val) : val; saveState(); render(); } }
    function addAccount() { const val = document.getElementById('new-acc-name')?.value.trim(); if (val) { state.accounts.push({ id: 'acc_' + Date.now(), name: val, initialBalance: 0, icon: 'wallet' }); saveState(); render(); } }
    function deleteAccount(id) { state.accounts = state.accounts.filter(a => a.id !== id); if (state.selectedAccountId === id) state.selectedAccountId = 'all'; saveState(); render(); }
    function switchCatType(t) { if (uiModal) { uiModal.catType = t; render(); } }
    function updateCat(id, f, val) { const c = state.categories.find(x => x.id === id); if (c) { c[f] = val; saveState(); render(); } }
    function addCat(type) { const val = document.getElementById('new-cat-name')?.value.trim(); if (val) { state.categories.push({ id: 'cat_' + Date.now(), name: val, type, color: '#10b981', icon: 'tag' }); saveState(); render(); } }
    function deleteCat(id) { state.categories = state.categories.filter(c => c.id !== id); saveState(); render(); }

    function changeMonth(d) { state.calendarMonth += d; if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear--; } if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; } saveState(); render(); }
    function selectCalendarDate(d) { state.selectedDate = d; saveState(); render(); }
    function saveEvent() {
      const title = document.getElementById('ev-title')?.value.trim();
      const date = document.getElementById('ev-date')?.value;
      const notifyBefore = document.getElementById('ev-before')?.value;
      const notifyTime = document.getElementById('ev-time')?.value;
      if (!title || !date) return alert('Заполни поля');
      state.events.push({ id: 'e_' + Date.now(), title, date, notifyBefore, notifyTime });
      uiModal = null; saveState(); render();
    }
    function deleteEvent(id) { state.events = state.events.filter(e => e.id !== id); saveState(); render(); }
    function testNotification() { alert('🔔 Clever: Скоро событие! Время проверить список.'); }
    function openModal(t) { uiModal = { type: t, catType: 'expense' }; render(); }
    function closeModal() { uiModal = null; render(); }

    render();
  </script>
</body>
</html>
